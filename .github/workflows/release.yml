# Builds Glassferry for macOS (arm64, x64) and Linux (x64, arm64).
#
# - Push a tag vX.Y.Z (equal to the version in tauri.conf.json, with a
#   section in CHANGELOG.md that becomes the release text): the bundles are
#   attached to a draft GitHub release, published by hand after a check.
# - Run it by hand (workflow_dispatch): build only, bundles kept as workflow
#   artifacts.
#
# macOS builds are signed ad-hoc and not notarized (no Apple Developer
# account yet): Gatekeeper blocks them on first launch, see the README.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported runners, so the AppImage and the .deb run on
          # older glibc versions too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Linux on ARM: Raspberry Pi, ARM servers, VMs on Apple silicon Macs.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section of this version, without its heading.
          awk -v v="$version" '
            /^## \[/ { found = index($0, "[" v "]") > 0; next }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No section for $version in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo "body<<GF_NOTES_EOF"
            cat notes.md
            echo "GF_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # Empty when run by hand: build only, no release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Glassferry __VERSION__
          releaseDraft: true
          releaseBody: ${{ steps.notes.outputs.body }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: glassferry-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
