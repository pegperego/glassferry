[package]
name = "glassferry"
version = "0.1.0"
description = "SFTP client that relies on the system OpenSSH"
authors = ["Roberto Codazzi"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "glassferry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
openssh-sftp-client = "0.15.10"
glob = "0.3.4"
thiserror = "2.0.21"
dirs = "7.0.0"
libc = "0.2.191"
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
bytes = "1.12.1"
trash = "5.2.9"
notify = "8.2.1"
sha2 = "0.11.1"
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["apple-native", "sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
